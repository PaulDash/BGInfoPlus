name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/BGInfoPlus.Tests -c Release
      - run: dotnet publish src/BGInfoPlus -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: BGInfoPlus-win-x64
          path: artifacts/win-x64/
