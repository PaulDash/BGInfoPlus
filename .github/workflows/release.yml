name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./tools/Build-Release.ps1 -Version $version
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem 'artifacts/release/${{ github.ref_name }}' -File | ForEach-Object FullName
          gh release create '${{ github.ref_name }}' @assets `
            --verify-tag `
            --title 'BGInfoPlus ${{ github.ref_name }}' `
            --generate-notes
